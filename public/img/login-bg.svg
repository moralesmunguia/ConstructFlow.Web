<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6A55C"/>
      <stop offset="35%" stop-color="#E98A5C"/>
      <stop offset="65%" stop-color="#4A5C8C"/>
      <stop offset="100%" stop-color="#0B1F47"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08162F" stop-opacity="0.25"/>
      <stop offset="55%" stop-color="#08162F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#08162F" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE7C2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#FFC98A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFC98A" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="900" height="1200" fill="url(#sky)"/>
  <circle cx="620" cy="260" r="220" fill="url(#sunGlow)"/>
  <circle cx="620" cy="260" r="70" fill="#FFE9CC" filter="url(#soft)"/>

  <!-- skyline lejano -->
  <g fill="#0B1F47" opacity="0.55">
    <rect x="0" y="780" width="70" height="300"/>
    <rect x="80" y="820" width="55" height="260"/>
    <rect x="150" y="760" width="60" height="320"/>
    <rect x="700" y="800" width="65" height="280"/>
    <rect x="780" y="840" width="60" height="240"/>
  </g>

  <!-- edificio en construcción -->
  <g stroke="#EDE7DD" stroke-width="2.5" fill="none" opacity="0.55">
    <rect x="330" y="600" width="260" height="480"/>
    <line x1="330" y1="690" x2="590" y2="690"/>
    <line x1="330" y1="780" x2="590" y2="780"/>
    <line x1="330" y1="870" x2="590" y2="870"/>
    <line x1="330" y1="960" x2="590" y2="960"/>
    <line x1="395" y1="600" x2="395" y2="1080"/>
    <line x1="460" y1="600" x2="460" y2="1080"/>
    <line x1="525" y1="600" x2="525" y2="1080"/>
  </g>
  <g fill="#0B1F47" opacity="0.5">
    <rect x="340" y="615" width="45" height="65"/>
    <rect x="405" y="615" width="45" height="65"/>
    <rect x="470" y="705" width="45" height="65"/>
    <rect x="535" y="615" width="45" height="65"/>
    <rect x="340" y="795" width="45" height="65"/>
    <rect x="470" y="885" width="45" height="65"/>
  </g>

  <!-- grua -->
  <g stroke="#F97316" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="180" y1="1080" x2="180" y2="280"/>
    <line x1="180" y1="300" x2="480" y2="300"/>
    <line x1="180" y1="300" x2="120" y2="360"/>
    <line x1="180" y1="330" x2="440" y2="330"/>
    <line x1="440" y1="330" x2="440" y2="470"/>
    <line x1="150" y1="280" x2="210" y2="280"/>
  </g>
  <rect x="160" y="1080" width="40" height="14" fill="#F97316"/>

  <rect width="900" height="1200" fill="url(#overlay)"/>
</svg>
